        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        :root{
          --primary:#00A8FF; --primary-deep:#0066FF; --accent:#00E5FF;
          --bg:#080C12; --card:#12161F; --card-2:#0C1017; --border:#1E2632;
          --text:#CBD5E1; --muted:#94A3B8; --danger:#FF4D6D; --success:#00FF88;
        }
        *{font-family:'Inter',system-ui,sans-serif}
        html{scroll-behavior:smooth}
        body{background:var(--bg); color:var(--text); margin:0; overflow-x:hidden}
        .app{overflow-x:hidden; max-width:100vw}
        ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#1e2a3a; border-radius:10px}
        
        .progress-bar{position:fixed; top:0; left:0; height:3px; background:linear-gradient(90deg,var(--primary),var(--accent)); z-index:100; transition:width .4s ease; box-shadow:0 0 12px var(--primary)}
        .header{position:fixed; top:0; left:0; right:0; height:64px; background:rgba(8,12,18,0.8); backdrop-filter:blur(18px); border-bottom:1px solid var(--border); z-index:50; display:flex; align-items:center}
        .navbar{max-width:1280px; margin:0 auto; width:100%; padding:0 24px; display:flex; justify-content:space-between; align-items:center; box-sizing:border-box}
        .logo{font-weight:900; font-size:20px; letter-spacing:-0.02em; color:#fff} .logo span{color:var(--primary); font-weight:400}
        .nav-links{display:flex; gap:28px; align-items:center}
        .nav-links a{color:var(--muted); font-size:14px; font-weight:500; text-decoration:none; transition:.2s} .nav-links a:hover{color:#fff}
        .cta{ background:linear-gradient(135deg,var(--primary),var(--primary-deep)); color:#fff; padding:10px 18px; border-radius:999px; font-weight:700; font-size:13px; letter-spacing:.02em; border:none; cursor:pointer; box-shadow:0 6px 20px rgba(0,168,255,.35); transition:.2s}
        .cta:hover{transform:translateY(-1px); box-shadow:0 10px 28px rgba(0,168,255,.5)}
        .hamburger{display:none; background:var(--card); border:1px solid var(--border); width:40px; height:40px; border-radius:10px; align-items:center; justify-content:center; color:#fff}
        .us-banner{margin-top:64px; background:linear-gradient(90deg,#0A4FD7,#00A8FF 55%,#00E5FF); color:#fff; text-align:center; padding:10px 16px; font-size:13px; font-weight:600; letter-spacing:.02em; position:relative; overflow:hidden}
        .us-banner::after{content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent); animation:shine 3s linear infinite}
        @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

        .hero{max-width:1280px; margin:0 auto; padding:56px 24px 24px; display:grid; grid-template-columns:1.15fr 0.85fr; gap:40px; align-items:center; min-height:560px; box-sizing:border-box; width:100%; overflow:hidden}
        .hero-label{color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.18em; margin-bottom:18px; display:flex; align-items:center; gap:10px}
        .hero-label::before{content:''; width:28px; height:2px; background:var(--accent); display:inline-block}
        .hero h1{font-size:clamp(38px,5.2vw,64px); line-height:.9; letter-spacing:-.04em; font-weight:900; color:#fff; margin:0 0 18px}
        .hero h1 i{font-style:normal; background:linear-gradient(90deg,#fff 20%,var(--primary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent}
        .hero-desc{color:var(--muted); font-size:16px; line-height:1.6; max-width:520px}
        .pills{display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 28px}
        .pill{border:1px solid var(--border); background:var(--card); color:var(--text); padding:7px 12px; border-radius:999px; font-size:12px; font-weight:600; display:flex; gap:6px; align-items:center}
        .pill.danger{border-color:rgba(255,77,109,.3); background:rgba(255,77,109,.08); color:#FF8DA3}
        .pill.success{border-color:rgba(0,255,136,.25); background:rgba(0,255,136,.08); color:var(--success)}
        .hero-actions{display:flex; gap:12px; flex-wrap:wrap}
        .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-deep)); color:#fff; border:none; padding:14px 22px; border-radius:12px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:8px; box-shadow:0 8px 24px rgba(0,102,255,.35)}
        .btn-ghost{background:var(--card); border:1px solid var(--border); color:#fff; padding:13px 20px; border-radius:12px; font-weight:600; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:8px}
        
        .visual{position:relative; height:560px; display:flex; align-items:center; justify-content:center; overflow:hidden; width:100%; max-width:100%}
        .circle{position:absolute; border-radius:50%; filter:blur(0px)}
        .circle.c1{width:420px; height:420px; background:radial-gradient(circle at 30% 30%,rgba(0,168,255,.18),transparent 60%); top:10%; left:5%; animation:float 6s ease-in-out infinite}
        .circle.c2{width:320px; height:320px; background:radial-gradient(circle at 70% 70%,rgba(0,229,255,.16),transparent 60%); bottom:8%; right:0%; animation:float 7s ease-in-out infinite reverse}
        .ring{position:absolute; border:1px solid rgba(0,168,255,.18); border-radius:50%; max-width:90vw; max-height:90vw}
        .ring.r1{width:420px; height:420px; animation:rotateSlow 30s linear infinite}
        .ring.r2{width:320px; height:320px; border-style:dashed; opacity:.5; animation:rotateSlow 22s linear infinite reverse}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
        @keyframes rotateSlow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        @keyframes fadeUp{0%{opacity:0; transform:translateY(18px)}100%{opacity:1; transform:translateY(0)}}
        .reveal{opacity:0; transform:translateY(18px)} .reveal.in-view{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) forwards}

        .laptop-stack{position:relative; width:340px; max-width:92%; height:380px; transform-style:preserve-3d}
        .laptop-card{position:absolute; left:50%; width:320px; max-width:100%; border-radius:18px; border:1px solid var(--border); background:linear-gradient(180deg,var(--card),var(--card-2)); box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); overflow:hidden; transition:transform .6s cubic-bezier(.2,.8,.2,1); box-sizing:border-box}
        .laptop-card.top{top:0; transform:translateX(-50%) rotateX(8deg) rotateZ(-2deg); z-index:3; height:200px}
        .laptop-card.mid{top:88px; transform:translateX(-48%) rotateX(8deg) rotateZ(1deg) scale(.96); z-index:2; height:190px; opacity:.92}
        .laptop-card.bot{top:168px; transform:translateX(-46%) rotateX(8deg) rotateZ(-1deg) scale(.92); z-index:1; height:190px; opacity:.8}
        .laptop-card:hover{transform:translateX(-50%) translateY(-6px) rotateX(8deg) rotateZ(0deg) !important}
        .card-inner{padding:14px}
        .card-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
        .card-dots{display:flex; gap:5px} .dot{width:8px; height:8px; border-radius:50%}
        .mini-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
        .mini{height:36px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--muted)}
        .spec-row{display:flex; gap:8px; margin-top:10px}
        .spec{flex:1; background:rgba(0,168,255,.08); border:1px solid rgba(0,168,255,.18); border-radius:8px; padding:8px; text-align:center}
        .spec b{color:#fff; font-size:11px; display:block} .spec span{font-size:9px; color:var(--muted)}

        .section{max-width:1280px; margin:0 auto; padding:32px 24px; box-sizing:border-box; width:100%; overflow:hidden}
        .section-head{display:flex; justify-content:space-between; align-items:end; margin-bottom:20px; gap:16px}
        .section-title{font-size:24px; font-weight:800; letter-spacing:-.02em; color:#fff}
        .tools-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
        .tool-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; gap:12px; align-items:center; transition:.2s}
        .tool-card:hover{border-color:rgba(0,168,255,.35); transform:translateY(-2px)}
        .tool-icon{width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,rgba(0,168,255,.18),rgba(0,102,255,.18)); display:flex; align-items:center; justify-content:center; color:var(--primary); flex-shrink:0}
        .warning-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
        .warn-card{background:linear-gradient(180deg,rgba(255,77,109,.09),rgba(255,77,109,.02)); border:1px solid rgba(255,77,109,.22); border-radius:14px; padding:16px}
        .warn-card h4{font-size:13px; font-weight:800; color:#FF8DA3; margin:0 0 6px; display:flex; gap:8px; align-items:center}
        .warn-card p{font-size:12.5px; line-height:1.5; color:var(--text); margin:0}

        .steps-wrap{display:grid; grid-template-columns: 1fr 320px; gap:24px; align-items:start}
        .step-row{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 18px 16px; margin-bottom:12px; position:relative; overflow:hidden; transition:.25s; cursor:pointer; max-width:100%; box-sizing:border-box}
        .step-row.done{border-color:rgba(0,255,136,.3); background:linear-gradient(180deg,rgba(0,255,136,.06),var(--card))}
        .step-row.danger{border-color:rgba(255,77,109,.22)}
        .step-row:hover{transform:translateY(-2px); border-color:rgba(0,168,255,.35)}
        .step-top{display:flex; gap:14px; align-items:flex-start}
        .step-num{width:36px; height:36px; border-radius:10px; background:var(--card-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; color:#fff; flex-shrink:0; transition:.2s}
        .step-row.done .step-num{background:var(--success); color:#000; border-color:var(--success)}
        .step-meta{flex:1}
        .step-title{font-weight:800; font-size:15px; color:#fff; line-height:1.25; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
        .step-time{font-size:11px; background:var(--card-2); border:1px solid var(--border); padding:3px 8px; border-radius:999px; color:var(--muted); font-weight:600}
        .step-desc{color:var(--muted); font-size:13px; line-height:1.55; margin:8px 0 10px}
        .step-details{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px}
        .step-details li{font-size:12.5px; color:var(--text); display:flex; gap:8px; line-height:1.4}
        .step-details li::before{content:'•'; color:var(--primary); font-weight:900}
        .step-tip{margin-top:12px; background:rgba(0,168,255,.08); border:1px dashed rgba(0,168,255,.25); border-radius:10px; padding:10px 12px; font-size:12px; color:#8ED4FF}
        .side-sticky{position:sticky; top:92px; display:flex; flex-direction:column; gap:12px}
        .side-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px}
        .progress-ring{display:flex; align-items:center; gap:14px}
        .ring-svg{width:56px; height:56px; transform:rotate(-90deg)} .ring-bg{stroke:var(--border)} .ring-fg{stroke:var(--primary); transition:stroke-dashoffset .6s ease; stroke-linecap:round}
        .faq-item{border-bottom:1px solid var(--border); padding:12px 0}
        .faq-q{width:100%; text-align:left; background:none; border:none; color:#fff; font-weight:700; font-size:13.5px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:6px 0}
        .faq-a{font-size:12.8px; line-height:1.6; color:var(--muted); max-height:0; overflow:hidden; transition:max-height .35s ease, opacity .25s; opacity:0}
        .faq-a.open{max-height:300px; opacity:1; margin-top:8px}

        .footer{border-top:1px solid var(--border); margin-top:40px; padding:28px 24px; max-width:1280px; margin-left:auto; margin-right:auto; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; color:var(--muted); font-size:12.5px; box-sizing:border-box; width:100%}
        .drawer{position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(8px); z-index:60; display:none} .drawer.open{display:block}
        .drawer-panel{position:absolute; right:0; top:0; bottom:0; width:300px; background:var(--card); border-left:1px solid var(--border); padding:20px; display:flex; flex-direction:column; gap:18px}
        .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--border); color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; box-shadow:0 12px 32px rgba(0,0,0,.5); z-index:90; display:flex; gap:8px; align-items:center; max-width:90vw}

        @media(max-width:980px){
          .hero{grid-template-columns:1fr; padding-top:32px; min-height:auto}
          .visual{height:420px; order:-1}
          .tools-grid{grid-template-columns:repeat(2,1fr)}
          .warning-grid{grid-template-columns:1fr}
          .steps-wrap{grid-template-columns:1fr}
          .side-sticky{position:relative; top:0}
          .nav-links{display:none}
          .hamburger{display:flex}
          .laptop-stack{transform:scale(.88); transform-origin:center}
        }
        @media(max-width:560px){

          .hero{padding-left:16px; padding-right:16px}
          .section{padding-left:16px; padding-right:16px}
          .pills{gap:6px}
          .navbar{padding:0 16px}
          .laptop-stack{width:300px}
          .laptop-card{width:280px}
        }
